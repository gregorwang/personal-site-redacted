<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全站出口 · 三种方向</title>
<style>
  :root {
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--serif); background: #141413; overflow: hidden; }

  /* ---------- 场景：模拟不同子页面 ---------- */
  .scene { position: fixed; inset: 0; transition: background .5s var(--ease), color .5s; display: grid; place-items: center; padding: 16px; }
  .scene h1 { font-weight: 400; font-size: clamp(32px, 7vw, 76px); letter-spacing: .04em; margin: 0; text-align: center; }
  .scene p { margin: 12px 0 0; opacity: .6; text-align: center; font-size: 14px; }
  .scene[data-scene="cv"]      { background: #faf9f5; color: #262421; --fg: #262421; --bg: #faf9f5; --accent: #d97757; --line: #d8d3c4; }
  .scene[data-scene="music"]   { background: radial-gradient(circle at 60% 40%, #2b2622, #0f0e0d 70%); color: #efe6d6; --fg: #efe6d6; --bg: #1a1816; --accent: #e0a96d; --line: #4a423a; }
  .scene[data-scene="messages"]{ background: #e9dcc3; color: #3b2f22; --fg: #3b2f22; --bg: #f4ead6; --accent: #b4553a; --line: #c9b593; }
  .scene[data-scene="chat"]    { background: #0d1117; color: #c9d1d9; --fg: #c9d1d9; --bg: #161b22; --accent: #7ee787; --line: #30363d; }
  .scene .deco { position: absolute; inset: 0; pointer-events: none; opacity: .5; }
  .scene[data-scene="music"] .deco { background: repeating-radial-gradient(circle at 60% 40%, transparent 0 6px, rgba(255,255,255,.025) 6px 7px); }
  .scene[data-scene="messages"] .deco { background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.03) 3px 4px); }
  .scene[data-scene="chat"] .deco { background: linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/260px 100% no-repeat; opacity: .8; }

  /* ---------- 控制台（预览用，不属于设计） ---------- */
  .panel { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px; border-radius: 14px; background: rgba(20,20,19,.86); backdrop-filter: blur(8px); color: #eee; font: 13px/1 system-ui, sans-serif; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .panel .group { display: flex; gap: 4px; align-items: center; }
  .panel .label { opacity: .5; margin: 0 4px 0 6px; }
  .panel button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 8px; color: #ccc; }
  .panel button[aria-pressed="true"] { background: #d97757; color: #fff; }
  .panel button:focus-visible { outline: 2px solid #d97757; outline-offset: 2px; }
  .note { position: fixed; right: 16px; top: 16px; z-index: 40; max-width: 300px; font: 12.5px/1.6 system-ui, sans-serif; color: var(--fg, #eee); opacity: .75; text-align: right; }
  @media (max-width: 640px) { .note { display: none; } }

  /* ============ A. 门牌吊签 ============ */
  .exit-tag { position: fixed; left: 20px; top: 0; z-index: 30; }
  .exit-tag .string { width: 1px; height: 22px; background: var(--fg); opacity: .5; margin-left: 34px; }
  .exit-tag .tag { all: unset; cursor: pointer; display: block; position: relative; transform-origin: 34px -22px; transition: transform .6s var(--ease); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px 4px 4px 18px; padding: 12px 14px 10px 26px; box-shadow: 0 6px 18px rgba(0,0,0,.12); font-size: 15px; letter-spacing: .12em; }
  .exit-tag .tag::before { content: ""; position: absolute; left: 10px; top: 50%; width: 7px; height: 7px; margin-top: -4px; border-radius: 50%; border: 1px solid var(--fg); opacity: .5; }
  .exit-tag .tag small { display: block; font-size: 10px; letter-spacing: .2em; opacity: .55; margin-top: 3px; }
  .exit-tag:hover .tag { transform: rotate(-4deg); }
  .exit-tag .tag:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .exit-tag .strip { margin: 8px 0 0 12px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 0; min-width: 170px; box-shadow: 0 10px 30px rgba(0,0,0,.15); transform-origin: top; transform: scaleY(0); opacity: 0; transition: transform .45s var(--ease), opacity .25s; }
  .exit-tag.open .strip { transform: scaleY(1); opacity: 1; }
  .exit-tag .strip a { display: flex; justify-content: space-between; gap: 16px; padding: 7px 14px; color: inherit; text-decoration: none; font-size: 14px; letter-spacing: .08em; border-bottom: 1px dashed var(--line); }
  .exit-tag .strip a:last-child { border-bottom: 0; }
  .exit-tag .strip a:hover, .exit-tag .strip a:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
  .exit-tag .strip a[aria-current] { color: var(--accent); }
  .exit-tag .strip a[aria-current]::after { content: "在此"; font-size: 10px; border: 1px solid var(--accent); border-radius: 2px; padding: 1px 4px; transform: rotate(-8deg); }

  /* ============ B. 罗盘 ============ */
  .exit-compass { position: fixed; left: 20px; top: 20px; z-index: 30; width: 52px; height: 52px; }
  .exit-compass .dial { all: unset; cursor: pointer; position: absolute; inset: 0; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.15), inset 0 0 0 4px color-mix(in srgb, var(--fg) 5%, transparent); display: grid; place-items: center; z-index: 2; }
  .exit-compass .dial:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .exit-compass .needle { width: 4px; height: 34px; position: relative; transition: transform .9s cubic-bezier(.3, 1.6, .5, 1); transform: rotate(-45deg); }
  .exit-compass .needle::before, .exit-compass .needle::after { content: ""; position: absolute; left: 0; width: 0; height: 0; border-left: 2px solid transparent; border-right: 2px solid transparent; }
  .exit-compass .needle::before { top: 0; border-bottom: 17px solid var(--accent); }
  .exit-compass .needle::after { bottom: 0; border-top: 17px solid var(--fg); opacity: .35; }
  .exit-compass .ticks { position: absolute; inset: 4px; border-radius: 50%; pointer-events: none; background: conic-gradient(from -2deg, var(--fg) 0 4deg, transparent 4deg 90deg, var(--fg) 90deg 94deg, transparent 94deg 180deg, var(--fg) 180deg 184deg, transparent 184deg 270deg, var(--fg) 270deg 274deg, transparent 274deg); -webkit-mask: radial-gradient(circle, transparent 18px, #000 19px); mask: radial-gradient(circle, transparent 18px, #000 19px); opacity: .3; z-index: 3; }
  .exit-compass:hover .needle { transform: rotate(-45deg) rotate(8deg); }
  .exit-compass .hint { position: absolute; left: 64px; top: 50%; transform: translate(-6px, -50%); white-space: nowrap; font-size: 13px; letter-spacing: .14em; color: var(--fg); opacity: 0; transition: .3s var(--ease); pointer-events: none; }
  .exit-compass:hover .hint { opacity: .7; transform: translate(0, -50%); }
  .exit-compass.open .hint { opacity: 0; }
  .exit-compass .pt { position: absolute; left: 26px; top: 26px; z-index: 1; transform: translate(-50%, -50%) scale(.4); opacity: 0; pointer-events: none; transition: transform .55s var(--ease), opacity .3s; transition-delay: calc(var(--i) * 30ms); display: flex; align-items: center; gap: 6px; color: var(--fg); text-decoration: none; font-size: 13px; letter-spacing: .08em; white-space: nowrap; }
  .exit-compass .pt span.dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--fg); background: var(--bg); flex: none; }
  .exit-compass .pt span.txt { background: var(--bg); padding: 3px 7px; border-radius: 4px; border: 1px solid var(--line); }
  .exit-compass .pt:hover span.dot, .exit-compass .pt:focus-visible span.dot { background: var(--accent); border-color: var(--accent); }
  .exit-compass .pt:focus-visible { outline: none; }
  .exit-compass .pt:focus-visible span.txt { border-color: var(--accent); }
  .exit-compass .pt[aria-current] span.txt { color: var(--accent); border-color: var(--accent); }
  .exit-compass.open .pt { opacity: 1; pointer-events: auto; transform: translate(calc(-4.5px + var(--x)), calc(-50% + var(--y))) scale(1); }
  .exit-compass.open .needle { transform: rotate(var(--aim, 135deg)); }

  /* ============ C. 终端提示符 ============ */
  .exit-term { position: fixed; left: 16px; top: 16px; z-index: 30; font-family: var(--mono); font-size: 13px; color: var(--fg); }
  .exit-term .prompt { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(6px); }
  .exit-term .prompt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .exit-term .tilde { color: var(--accent); }
  .exit-term .path { opacity: .85; }
  .exit-term .caret { width: 7px; height: 14px; background: var(--fg); margin-left: 6px; animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .exit-term .prompt:hover .path { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent); }
  .exit-term .box { margin-top: 6px; min-width: 240px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); box-shadow: 0 12px 30px rgba(0,0,0,.25); overflow: hidden; clip-path: inset(0 0 100% 0); transition: clip-path .4s var(--ease); }
  .exit-term.open .box { clip-path: inset(0 0 0 0); }
  .exit-term .box .in { display: flex; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .exit-term .box .in span { color: var(--accent); }
  .exit-term .box input { all: unset; flex: 1; caret-color: var(--accent); }
  .exit-term .box ul { list-style: none; margin: 0; padding: 4px 0; }
  .exit-term .box a { display: flex; justify-content: space-between; gap: 18px; padding: 6px 12px; color: inherit; text-decoration: none; }
  .exit-term .box a b { font-weight: 400; opacity: .5; font-family: var(--serif); }
  .exit-term .box a:hover, .exit-term .box a.hl { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .exit-term .box a:focus-visible { outline: none; background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .exit-term .box a[aria-current] { color: var(--accent); }
  .exit-term .box a[aria-current]::before { content: "* "; }
  .exit-term .box .empty { padding: 6px 12px; opacity: .5; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
  }
</style>
</head>
<body>

<main class="scene" id="scene" data-scene="music">
  <div class="deco"></div>
  <div><h1 id="sceneTitle">音乐之旅</h1><p id="sceneSub">模拟子页面背景 · 出口在左上角</p></div>
</main>

<div class="note" id="note"></div>
<div id="exitMount"></div>

<nav class="panel" aria-label="预览控制">
  <div class="group" role="group" aria-label="出口样式">
    <span class="label">样式</span>
    <button data-style="tag">A 门牌吊签</button>
    <button data-style="compass">B 罗盘</button>
    <button data-style="term">C 终端提示符</button>
  </div>
  <div class="group" role="group" aria-label="模拟页面">
    <span class="label">页面</span>
    <button data-scene="cv">简历</button>
    <button data-scene="music">音乐</button>
    <button data-scene="messages">留言</button>
    <button data-scene="chat">Nemesis</button>
  </div>
  <div class="group"><button id="sound" aria-pressed="true">声音 开</button></div>
</nav>

<script>
const PAGES = [
  { key: "home", label: "首页", path: "/" },
  { key: "cv", label: "个人简历", path: "/cv" },
  { key: "gallery", label: "影像记忆", path: "/gallery" },
  { key: "music", label: "音乐之旅", path: "/music" },
  { key: "game", label: "游戏世界", path: "/game" },
  { key: "chat", label: "RAG-Nemesis", path: "/chat" },
  { key: "anime", label: "动漫回忆", path: "/anime" },
  { key: "messages", label: "留言电台", path: "/messages" },
  { key: "updates", label: "日志更新", path: "/updates" },
];
const SCENE_TITLE = { cv: "个人简历", music: "音乐之旅", messages: "留言电台", chat: "RAG-Nemesis" };
const NOTES = {
  tag: "A · 门牌吊签：一根线吊着的小纸签「汪 · 回家」。悬停会晃一下，点开展开一条纸带目录，当前页盖「在此」小章。最温和，最像实物。",
  compass: "B · 罗盘：针平时永远指向左上——「家」的方向。点开后各页面沿四分之一圆弧散开，针转向你停留的那一项。最有玩具感。",
  term: "C · 终端提示符：左上角显示当前路径 ~/music，光标在闪。点开可以直接打字过滤（试试输入 g），↑↓ 选择、回车跳转。和 ASCII 页脚是一家人。",
};

let state = { style: "tag", scene: "music", sound: true };
let audio;
function tick(freq = 880, dur = 0.05) {
  if (!state.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.08, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}
const current = () => PAGES.find(p => p.key === state.scene);
const linkAttrs = p => `href="#${p.path}" data-key="${p.key}" ${p.key === state.scene ? 'aria-current="page"' : ""}`;

function renderTag() {
  return `<div class="exit-tag" data-exit>
    <div class="string"></div>
    <button class="tag" aria-expanded="false" aria-controls="exit-list">汪 · 回家<small>${current().label}</small></button>
    <nav class="strip" id="exit-list" aria-label="全站目录">${PAGES.map(p => `<a ${linkAttrs(p)}><span>${p.label}</span></a>`).join("")}</nav>
  </div>`;
}
function renderCompass() {
  const n = PAGES.length, R = 128;
  const pts = PAGES.map((p, i) => {
    const a = (i / (n - 1)) * (Math.PI / 2); // 0 → 90°，从正右到正下
    const x = Math.cos(a) * R, y = Math.sin(a) * R;
    const deg = 90 + (a * 180 / Math.PI);
    return `<a class="pt" style="--i:${i};--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px" data-deg="${deg}" ${linkAttrs(p)}><span class="dot"></span><span class="txt">${p.label}</span></a>`;
  }).join("");
  return `<div class="exit-compass" data-exit>
    ${pts}
    <button class="dial" aria-expanded="false" aria-label="打开全站目录（当前：${current().label}）"><span class="needle"></span></button>
    <span class="ticks"></span>
    <span class="hint">回家</span>
  </div>`;
}
function renderTerm() {
  return `<div class="exit-term" data-exit>
    <button class="prompt" aria-expanded="false" aria-controls="exit-list"><span class="tilde">~</span><span class="path">${current().path === "/" ? "" : current().path}</span><span class="caret"></span></button>
    <div class="box" id="exit-list">
      <label class="in"><span>cd</span><input type="text" placeholder="去哪儿？" aria-label="输入页面名过滤" autocomplete="off" spellcheck="false"></label>
      <ul></ul>
    </div>
  </div>`;
}

function mount() {
  const el = document.getElementById("exitMount");
  el.innerHTML = { tag: renderTag, compass: renderCompass, term: renderTerm }[state.style]();
  const root = el.querySelector("[data-exit]");
  const btn = root.querySelector("button");
  const setOpen = open => {
    root.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
    root.querySelectorAll("a").forEach(a => a.tabIndex = open ? 0 : -1);
    tick(open ? 990 : 660);
    if (open && state.style === "term") setTimeout(() => root.querySelector("input").focus(), 50);
  };
  btn.addEventListener("click", () => setOpen(!root.classList.contains("open")));
  root.addEventListener("click", e => {
    const a = e.target.closest("a"); if (!a) return;
    e.preventDefault(); go(a.dataset.key);
  });

  if (state.style === "compass") {
    root.addEventListener("pointerover", e => {
      const a = e.target.closest(".pt"); if (a) { root.style.setProperty("--aim", a.dataset.deg + "deg"); tick(1400, .02); }
    });
    root.addEventListener("focusin", e => {
      const a = e.target.closest(".pt"); if (a) root.style.setProperty("--aim", a.dataset.deg + "deg");
    });
    const cur = root.querySelector('.pt[aria-current]'); if (cur) root.style.setProperty("--aim", cur.dataset.deg + "deg");
  }

  if (state.style === "term") {
    const input = root.querySelector("input"), ul = root.querySelector("ul");
    let hl = 0, list = PAGES;
    const draw = () => {
      ul.innerHTML = list.length
        ? list.map((p, i) => `<li><a class="${i === hl ? "hl" : ""}" ${linkAttrs(p)}>${p.path === "/" ? "~" : "~" + p.path}<b>${p.label}</b></a></li>`).join("")
        : `<li class="empty">no such page</li>`;
      ul.querySelectorAll("a").forEach(a => a.tabIndex = root.classList.contains("open") ? 0 : -1);
    };
    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase();
      list = PAGES.filter(p => !q || p.path.includes(q) || p.label.toLowerCase().includes(q) || p.key.includes(q));
      hl = 0; draw(); tick(1200, .015);
    });
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { hl = Math.min(hl + 1, list.length - 1); draw(); e.preventDefault(); }
      if (e.key === "ArrowUp") { hl = Math.max(hl - 1, 0); draw(); e.preventDefault(); }
      if (e.key === "Enter" && list[hl]) go(list[hl].key);
    });
    draw();
  }

  root.querySelectorAll("a").forEach(a => a.tabIndex = -1);
  document.onkeydown = e => { if (e.key === "Escape" && root.classList.contains("open")) { setOpen(false); btn.focus(); } };
  document.onpointerdown = e => { if (!root.contains(e.target) && root.classList.contains("open")) setOpen(false); };
}

function go(key) {
  if (SCENE_TITLE[key]) { state.scene = key; sync(); }
  else {
    // 预览里只有四个模拟页面，其余页面给个反馈
    document.getElementById("sceneSub").textContent = `（预览）将跳转到 ${PAGES.find(p => p.key === key).path}`;
    document.querySelector("[data-exit]").classList.remove("open");
    tick(520, .08);
  }
}

function sync() {
  const scene = document.getElementById("scene");
  scene.dataset.scene = state.scene;
  document.getElementById("sceneTitle").textContent = SCENE_TITLE[state.scene];
  document.getElementById("sceneSub").textContent = "模拟子页面背景 · 出口在左上角";
  document.getElementById("note").textContent = NOTES[state.style];
  // 让 note 和出口都能读到场景变量
  const cs = getComputedStyle(scene);
  ["--fg", "--bg", "--accent", "--line"].forEach(v => document.body.style.setProperty(v, cs.getPropertyValue(v)));
  document.querySelectorAll("[data-style]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.style === state.style)));
  document.querySelectorAll("[data-scene]").forEach(b => { if (b.tagName === "BUTTON") b.setAttribute("aria-pressed", String(b.dataset.scene === state.scene)); });
  mount();
}

document.querySelectorAll("[data-style]").forEach(b => b.addEventListener("click", () => { state.style = b.dataset.style; sync(); }));
document.querySelectorAll("button[data-scene]").forEach(b => b.addEventListener("click", () => { state.scene = b.dataset.scene; sync(); }));
document.getElementById("sound").addEventListener("click", e => {
  state.sound = !state.sound;
  e.currentTarget.setAttribute("aria-pressed", String(state.sound));
  e.currentTarget.textContent = state.sound ? "声音 开" : "声音 关";
});
sync();
</script>
</body>
</html>
